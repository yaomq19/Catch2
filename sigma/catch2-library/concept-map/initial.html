<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch2 Concept Map</title>
    <link
      rel="stylesheet"
      href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css">
    <script>
      window.EXCALIDRAW_ASSET_PATH =
        "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { height: 100%; width: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import React from "https://esm.sh/react@19.0.0";
      import { createRoot } from "https://esm.sh/react-dom@19.0.0/client";
      import * as ExcalidrawLib from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";

      const { Excalidraw, convertToExcalidrawElements } = ExcalidrawLib;

      const elementsData = [
        { type: "rectangle", x: 40, y: 40, width: 250, height: 78, backgroundColor: "#99e9f2", strokeColor: "#0c8599", fillStyle: "solid", strokeWidth: 2, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 62, y: 63, text: "Catch2 Learning Path", fontSize: 22, width: 210, fontFamily: 2, textAlign: "center" },

        { type: "rectangle", x: 40, y: 190, width: 250, height: 80, backgroundColor: "#ffd8a8", strokeColor: "#e8590c", fillStyle: "solid", strokeWidth: 2, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 60, y: 208, text: "Usage Layer\nwrite clear tests", fontSize: 20, width: 210, fontFamily: 2, textAlign: "center" },
        { type: "arrow", x: 165, y: 118, width: 0, height: 66, strokeColor: "#495057", strokeWidth: 2 },

        { type: "rectangle", x: 390, y: 190, width: 250, height: 80, backgroundColor: "#b2f2bb", strokeColor: "#2f9e44", fillStyle: "solid", strokeWidth: 2, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 410, y: 208, text: "Build Layer\nCMake and runner", fontSize: 20, width: 210, fontFamily: 2, textAlign: "center" },
        { type: "arrow", x: 290, y: 230, width: 92, height: 0, strokeColor: "#495057", strokeWidth: 2 },

        { type: "rectangle", x: 740, y: 190, width: 250, height: 80, backgroundColor: "#a5d8ff", strokeColor: "#1971c2", fillStyle: "solid", strokeWidth: 2, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 760, y: 208, text: "Internal Layer\nmacros to reports", fontSize: 20, width: 210, fontFamily: 2, textAlign: "center" },
        { type: "arrow", x: 640, y: 230, width: 92, height: 0, strokeColor: "#495057", strokeWidth: 2 },

        { type: "rectangle", x: 40, y: 350, width: 210, height: 62, backgroundColor: "#fff3bf", strokeColor: "#f08c00", fillStyle: "solid", strokeWidth: 1, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 58, y: 370, text: "Failure attribution", fontSize: 18, width: 174, fontFamily: 2, textAlign: "center" },
        { type: "rectangle", x: 280, y: 350, width: 210, height: 62, backgroundColor: "#fff3bf", strokeColor: "#f08c00", fillStyle: "solid", strokeWidth: 1, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 303, y: 370, text: "REQUIRE and CHECK", fontSize: 18, width: 166, fontFamily: 2, textAlign: "center" },
        { type: "rectangle", x: 520, y: 350, width: 210, height: 62, backgroundColor: "#fff3bf", strokeColor: "#f08c00", fillStyle: "solid", strokeWidth: 1, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 552, y: 370, text: "SECTION tree", fontSize: 18, width: 146, fontFamily: 2, textAlign: "center" },
        { type: "rectangle", x: 760, y: 350, width: 210, height: 62, backgroundColor: "#e9ecef", strokeColor: "#495057", fillStyle: "solid", strokeWidth: 1, roughness: 1, opacity: 100, roundness: { type: 3 } },
        { type: "text", x: 792, y: 370, text: "Registry and runner", fontSize: 18, width: 146, fontFamily: 2, textAlign: "center" },

        { type: "arrow", x: 145, y: 270, width: 0, height: 72, strokeColor: "#495057", strokeWidth: 1 },
        { type: "arrow", x: 250, y: 381, width: 22, height: 0, strokeColor: "#495057", strokeWidth: 1 },
        { type: "arrow", x: 490, y: 381, width: 22, height: 0, strokeColor: "#495057", strokeWidth: 1 },
        { type: "arrow", x: 730, y: 381, width: 22, height: 0, strokeColor: "#495057", strokeWidth: 1 }
      ];

      const elements = convertToExcalidrawElements(elementsData);

      function App() {
        return React.createElement(
          "div",
          { style: { height: "100%", width: "100%" } },
          React.createElement(Excalidraw, {
            initialData: {
              elements: elements,
              appState: { viewBackgroundColor: "#ffffff" },
              scrollToContent: true
            },
            langCode: "en"
          })
        );
      }

      const root = createRoot(document.getElementById("app"));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
